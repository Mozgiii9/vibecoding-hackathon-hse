[project]
name = "ryadom-stt"
version = "0.1.0"
description = "Private CPU speech transcription sidecar for Ryadom"
requires-python = ">=3.11,<3.14"
dependencies = ["faster-whisper==1.2.1", "pydantic>=2.11,<3", "av>=18,<19", "numpy>=2,<2.5"]

[dependency-groups]
dev = ["mypy>=1.15,<2", "ruff>=0.11,<1"]

[project.scripts]
ryadom-stt = "ryadom_stt.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "av", "av.*"]
ignore_missing_imports = true
